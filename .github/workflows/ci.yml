name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go vet ./...

      - run: go test -race ./...

      - run: tests/scripts/smoke.sh

      - if: always()
        run: tests/scripts/stop.sh
